 case'pj':return!p.lamp?'لامپ خاموش است.':Math.abs(p.lens-.5)>.1?'تصویر تار است؛ لنز را جابه‌جا کن.':(p.loop<.3||p.loop>.75)?'حلقهٔ فیلم شل/سفت است.':Math.abs(p.sync)>.3?'شاتر با چنگک هماهنگ نیست.':Math.abs(p.tilt-.55)>.1?'تصویر وسط پرده نیست؛ ارتفاع پایه را تنظیم کن.':'تصویر روی پرده عالی است.'}}
function say(t){$('st').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>{if(S.sel)$('st').textContent=diag(S.sel)},2500)}

function part(p){cur=p;const L=CT[S.sel],ps=[...new Set(L.map(c=>c.p))],el=$('ctl');
 el.innerHTML='<div class="pc">'+ps.map(q=>'<button data-p="'+q+'" class="'+(q==p?'on':'')+'">'+PN[q]+'</button>').join('')+'</div>';
 L.filter(c=>c.p==p).forEach(c=>{const d=document.createElement('div');d.className='c';
  if(c.t=='keys'){d.className='kb';d.innerHTML=['دو','ر','می','فا','سل','لا','سی'].map((n,i)=>'<button data-k="'+i+'">'+n+'</button>').join('')}
  else if(c.t=='range'){d.innerHTML='<label>'+c.l+'<output>'+c.fmt(c.g())+'</output></label><input type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.g()+'"><small>'+c.h+'</small>';
   d.querySelector('input').oninput=e=>{c.s(+e.target.value);d.querySelector('output').textContent=c.fmt(c.g());S.rev+=(S.sel=='sew'?1:0);touch()}}
  else if(c.t=='sw'){d.innerHTML='<label>'+c.l+'</label><div class="ab">'+c.opts.map((o,i)=>'<button data-s="'+i+'" class="'+(c.g()==i?'on':'')+'">'+o+'</button>').join('')+'</div><small>'+c.h+'</small>';
   d.querySelectorAll('button').forEach(b=>b.onclick=()=>{c.s(+b.dataset.s);touch();part(cur)})}
  else if(c.t=='btn'){d.className='ab';const b=document.createElement('button');b.textContent=typeof c.l=='function'?c.l():c.l;b.onclick=()=>{au();c.f();touch();part(cur)};d.appendChild(b)}
  else if(c.t=='info')d.innerHTML='<small>'+c.l()+'</small>';
  el.appendChild(d)});
 if(mo)mo.g.traverse(m=>{if(m.isMesh&&m.userData.part&&m.material.emissive)m.material.emissive.setHex(m.userData.part==p?0x1a6b45:0)})}
$('ctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p)part(b.dataset.p);else if(b.dataset.k!==undefined){au();typeNote(+b.dataset.k)}};
$('pp').onclick=()=>{au();PL[S.sel][2]();touch();part(cur)};

ms.add(new T.HemisphereLight(0xfff0dd,0x222233,.9));const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(2,4,3);ms.add(dl);

mn.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,m:0};mn.setPointerCapture(e.pointerId)};
mn.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>3)dr.m=1;my-=dx*.012;mp=Math.max(.05,Math.min(1.3,mp+dy*.008));dr.x=e.clientX;dr.y=e.clientY};
mn.onpointerup=e=>{if(dr&&!dr.m&&mo){const r=mn.getBoundingClientRect(),v=new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),rc=new T.Raycaster();rc.setFromCamera(v,mc);const h=rc.intersectObject(mo.g,true).find(i=>i.object.userData.part&&CT[S.sel].some(c=>c.p==i.object.userData.part));if(h)part(h.object.userData.part)}dr=null};

$('x').onclick=()=>close();

const tp=new T.Vector3(),tl=new T.Vector3(),lk=new T.Vector3(0,1.5,-2);let vid=null;cam.position.set(0,2.4,5.4);
let d0=null;const mcv=$('main');
mcv.onpointerdown=e=>{d0={x:e.clientX,m:0}};mcv.onpointermove=e=>{if(!d0)return;const dx=e.clientX-d0.x;if(Math.abs(dx)>4){d0.m=1;if(!vid)S.yaw=Math.max(-.6,Math.min(.6,S.yaw-dx*.003));d0.x=e.clientX}};
mcv.onpointerup=e=>{if(d0&&!d0.m){const v=new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),rc=new T.Raycaster();rc.setFromCamera(v,cam);const h=rc.intersectObjects(mains,true)[0];if(h){let o=h.object;while(o&&!o.userData.id)o=o.parent;if(o)open(o.userData.id)}}d0=null};
let por=false;function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;por=innerWidth<innerHeight;cam.fov=por?80:55;cam.updateProjectionMatrix();if(S.sel)sz()}addEventListener('resize',rs);rs();
const pv=new T.Vector3();let last=performance.now();
(function L(n){requestAnimationFrame(L);const dt=Math.min((n-last)/1000,.05);last=n;sim(dt);const t=n/1000;for(const k in INST)INST[k].forEach(o=>o.upd(dt,t));
 if(vid){const x=XS[vid];tp.set(x*.9,1.7,1.5);tl.set(x,.75,0)}else{tp.set(S.yaw*4,por?2.5:2.2,por?5.4:4.6);tl.set(S.yaw*1.5,1.6,-2)}
 cam.position.lerp(tp,.07);lk.lerp(tl,.07);cam.lookAt(lk);R.render(sc,cam);
 if(!vid)for(const id in XS){pv.set(XS[id],1.75,0).project(cam);const b=$('lb_'+id);b.style.left=(pv.x+1)/2*innerWidth+'px';b.style.top=(1-pv.y)/2*innerHeight+'px'}
 if(S.sel&&mo){const r=MR[S.sel];mc.position.set(Math.sin(my)*Math.cos(mp)*r,MH[S.sel]+Math.sin(mp)*r,Math.cos(my)*Math.cos(mp)*r);mc.lookAt(0,MH[S.sel],0);mr.render(ms,mc)}})(last);
touch();
